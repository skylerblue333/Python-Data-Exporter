name: data-exporter-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q main.py src tests
      - name: Lint
        run: ruff check main.py src tests
      - name: Tests
        run: pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: CLI help smoke test
        run: python main.py --help | grep -q 'Bounded read-only SQLite query exporter'
      - name: Build image
        run: docker build -t sky-data-exporter:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-data-exporter:ci -u)" != "0"
